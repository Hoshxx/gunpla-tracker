name: Update news
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_news.py
      - name: Save changes and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update news"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
